
[project]
name = "voyage-ai"
version = "0.1.0"
description = "AI-powered travel planning assistant"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.162.2",
    "grandalf>=0.8",
    "httpx",
    "langchain>=1.4.8",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
